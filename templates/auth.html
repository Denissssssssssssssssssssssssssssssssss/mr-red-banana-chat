<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7FXQNJGWQW"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-7FXQNJGWQW');
    </script>

    <title>Mr.Red Banana Chat</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans JP",
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f5f6f8,
                    #e9ebef
                );

            color: #222;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;
        }

        .container {

            width: 100%;

            max-width: 430px;

            background: white;

            border-radius: 20px;

            box-shadow:
                0 12px 40px
                rgba(0, 0, 0, 0.10);

            padding: 40px;
        }

        .logo {

            text-align: center;

            font-size: 28px;

            font-weight: 700;

            margin-bottom: 8px;
        }

        .subtitle {

            text-align: center;

            color: #777;

            font-size: 14px;

            margin-bottom: 30px;
        }

        .tabs {

            display: flex;

            margin-bottom: 25px;

            border-bottom: 1px solid #ddd;
        }

        .tab {

            flex: 1;

            padding: 12px;

            border: none;

            background: transparent;

            color: #888;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            border-bottom: 2px solid transparent;
        }

        .tab.active {

            color: #111;

            border-bottom:
                2px solid #111;
        }

        .form {

            display: none;
        }

        .form.active {

            display: block;
        }

        .field {

            margin-bottom: 18px;
        }

        .field label {

            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: 600;
        }

        .field input {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d5d5d5;

            border-radius: 10px;

            font-size: 15px;

            outline: none;

            transition:
                border-color 0.2s,
                box-shadow 0.2s;
        }

        .field input:focus {

            border-color: #555;

            box-shadow:
                0 0 0 3px
                rgba(0, 0, 0, 0.06);
        }

        .help {

            margin-top: -8px;

            margin-bottom: 18px;

            font-size: 13px;

            color: #888;
        }

        .forgot {

            display: block;

            text-align: right;

            margin-top: -8px;

            margin-bottom: 20px;

            color: #555;

            font-size: 13px;

            text-decoration: none;

            cursor: pointer;
        }

        .forgot:hover {

            text-decoration: underline;
        }

        .button {

            width: 100%;

            border: none;

            border-radius: 10px;

            padding: 14px;

            background: #111;

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition:
                opacity 0.2s,
                transform 0.1s;
        }

        .button:hover {

            opacity: 0.85;
        }

        .button:active {

            transform: scale(0.99);
        }

        .notice {

            margin-top: 22px;

            padding: 13px 15px;

            background: #f7f7f7;

            border-radius: 10px;

            color: #777;

            font-size: 12px;

            line-height: 1.7;

            text-align: center;
        }

        .optional {

            font-weight: normal;

            color: #999;

            font-size: 12px;
        }

        .password-note {

            margin-top: 7px;

            font-size: 12px;

            color: #999;

            line-height: 1.5;
        }

        @media (max-width: 600px) {

            body {

                padding: 15px;
            }

            .container {

                padding: 30px 22px;
            }

            .logo {

                font-size: 24px;
            }
        }

    </style>

</head>


<body>

<div class="container">

    <div class="logo">
        Mr.Red Banana Chat
    </div>

    <div class="subtitle">
        みんなで話せるオンラインチャット
    </div>


    <!-- ========================================= -->
    <!-- タブ -->
    <!-- ========================================= -->

    <div class="tabs">

        <button
            type="button"
            class="tab active"
            id="loginTab"
            onclick="showForm('login')"
        >
            ログイン
        </button>

        <button
            type="button"
            class="tab"
            id="registerTab"
            onclick="showForm('register')"
        >
            新規登録
        </button>

    </div>


    <!-- ========================================= -->
    <!-- ログイン -->
    <!-- ========================================= -->

    <form
        id="loginForm"
        class="form active"
        method="POST"
        action="{{ url_for('login') }}"
    >

        <div class="field">

            <label for="loginUsername">
                ユーザーネーム
            </label>

            <input
                type="text"
                id="loginUsername"
                name="username"
                autocomplete="username"
                required
            >

        </div>


        <div class="field">

            <label for="loginPassword">
                パスワード
            </label>

            <input
                type="password"
                id="loginPassword"
                name="password"
                autocomplete="current-password"
                required
            >

        </div>


        <a
            href="{{ url_for('forgot_password') }}"
            class="forgot"
        >
            パスワードを忘れた場合
        </a>


        <button
            type="submit"
            class="button"
        >
            ログイン
        </button>

    </form>


    <!-- ========================================= -->
    <!-- 新規登録 -->
    <!-- ========================================= -->

    <form
        id="registerForm"
        class="form"
        method="POST"
        action="{{ url_for('register') }}"
    >

        <div class="field">

            <label for="registerUsername">
                ユーザーネーム
            </label>

            <input
                type="text"
                id="registerUsername"
                name="username"
                autocomplete="username"
                maxlength="100"
                required
            >

        </div>


        <div class="field">

            <label for="registerPassword">
                パスワード
            </label>

            <input
                type="password"
                id="registerPassword"
                name="password"
                autocomplete="new-password"
                minlength="8"
                required
            >

            <div class="password-note">
                8文字以上で設定してください。
            </div>

        </div>


        <div class="field">

            <label for="registerEmail">

                メールアドレス

                <span class="optional">
                    （任意）
                </span>

            </label>

            <input
                type="email"
                id="registerEmail"
                name="email"
                autocomplete="email"
                placeholder="example@example.com"
            >

        </div>


        <div class="help">

            メールアドレスは任意です。<br>

            登録すると、パスワードを忘れたときに
            再設定メールを受け取れます。

        </div>


        <button
            type="submit"
            class="button"
        >
            アカウントを作成
        </button>

    </form>


    <!-- ========================================= -->
    <!-- 注意 -->
    <!-- ========================================= -->

    <div class="notice">

        メールアドレスを登録しなくても
        Mr.Red Banana Chatを利用できます。

    </div>

</div>


<script>

    function showForm(type) {

        const loginForm =
            document.getElementById(
                "loginForm"
            );

        const registerForm =
            document.getElementById(
                "registerForm"
            );

        const loginTab =
            document.getElementById(
                "loginTab"
            );

        const registerTab =
            document.getElementById(
                "registerTab"
            );


        if (type === "login") {

            loginForm.classList.add(
                "active"
            );

            registerForm.classList.remove(
                "active"
            );

            loginTab.classList.add(
                "active"
            );

            registerTab.classList.remove(
                "active"
            );

        } else {

            loginForm.classList.remove(
                "active"
            );

            registerForm.classList.add(
                "active"
            );

            loginTab.classList.remove(
                "active"
            );

            registerTab.classList.add(
                "active"
            );

        }

    }

</script>

</body>

</html>
