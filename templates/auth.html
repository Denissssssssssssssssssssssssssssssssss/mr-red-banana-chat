```html
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mr.Red Banana 暇人チャッツ</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #f5f5f5;
            color: #222;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans JP",
                sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;

            background: #fff;

            border-radius: 20px;

            padding: 35px 30px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;

            font-size: 30px;

            font-weight: 800;

            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;

            color: #777;

            font-size: 14px;

            margin-bottom: 30px;
        }

        .tabs {
            display: flex;

            border-bottom: 1px solid #ddd;

            margin-bottom: 25px;
        }

        .tab {
            flex: 1;

            padding: 12px 5px;

            border: none;

            background: transparent;

            font-size: 15px;

            font-weight: bold;

            color: #888;

            cursor: pointer;

            border-bottom: 2px solid transparent;
        }

        .tab.active {
            color: #222;

            border-bottom-color: #222;
        }

        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        .description {
            margin-bottom: 20px;

            font-size: 13px;

            line-height: 1.7;

            color: #777;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: 600;
        }

        .field input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d7d7d7;

            border-radius: 10px;

            background: #fff;

            font-size: 15px;

            outline: none;

            transition: border-color 0.2s;
        }

        .field input:focus {
            border-color: #555;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 70px;
        }

        .show-password {
            position: absolute;

            right: 10px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            color: #777;

            font-size: 12px;

            cursor: pointer;

            padding: 5px;
        }

        .button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #222;

            color: #fff;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: background 0.2s;
        }

        .button:hover {
            background: #444;
        }

        .button:active {
            transform: translateY(1px);
        }

        .security-note {
            margin-top: 18px;

            padding: 12px;

            border-radius: 10px;

            background: #f7f7f7;

            color: #777;

            font-size: 12px;

            line-height: 1.7;

            text-align: center;
        }

        .message {
            display: none;

            margin-bottom: 15px;

            padding: 11px;

            border-radius: 9px;

            background: #fff1f1;

            color: #b00020;

            font-size: 13px;

            line-height: 1.6;
        }

        .message.show {
            display: block;
        }

        .password-rule {
            margin-top: 7px;

            font-size: 11px;

            color: #888;

            line-height: 1.5;
        }

        @media (max-width: 480px) {

            body {
                padding: 10px;
            }

            .container {
                padding: 28px 20px;
            }

            .logo {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        Mr.Red Banana
    </div>

    <div class="subtitle">
        暇人チャッツ
    </div>


    <!-- =========================
         タブ
    ========================== -->

    <div class="tabs">

        <button
            type="button"
            class="tab active"
            id="loginTab"
        >
            ログイン
        </button>

        <button
            type="button"
            class="tab"
            id="registerTab"
        >
            新規登録
        </button>

    </div>


    <!-- =========================
         エラーメッセージ
    ========================== -->

    <div
        class="message"
        id="message"
    ></div>


    <!-- =========================
         ログイン
    ========================== -->

    <form
        class="form active"
        id="loginForm"
        action="{{ url_for('login') }}"
        method="POST"
    >

        <div class="description">
            ユーザーネームとパスワードを入力して
            ログインしてください。
        </div>


        <div class="field">

            <label for="loginUsername">
                ユーザーネーム
            </label>

            <input
                type="text"
                id="loginUsername"
                name="username"
                autocomplete="username"
                required
                maxlength="100"
                placeholder="ユーザーネーム"
            >

        </div>


        <div class="field">

            <label for="loginPassword">
                パスワード
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="loginPassword"
                    name="password"
                    autocomplete="current-password"
                    required
                    placeholder="パスワード"
                >

                <button
                    type="button"
                    class="show-password"
                    data-target="loginPassword"
                >
                    表示
                </button>

            </div>

        </div>


        <button
            type="submit"
            class="button"
        >
            ログイン
        </button>

    </form>


    <!-- =========================
         新規登録
    ========================== -->

    <form
        class="form"
        id="registerForm"
        action="{{ url_for('register') }}"
        method="POST"
    >

        <div class="description">
            ユーザーネームとパスワードを設定して
            アカウントを作成します。
        </div>


        <div class="field">

            <label for="registerUsername">
                ユーザーネーム
            </label>

            <input
                type="text"
                id="registerUsername"
                name="username"
                autocomplete="username"
                required
                maxlength="100"
                placeholder="好きなユーザーネーム"
            >

        </div>


        <div class="field">

            <label for="registerPassword">
                パスワード
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="registerPassword"
                    name="password"
                    autocomplete="new-password"
                    required
                    minlength="8"
                    placeholder="8文字以上"
                >

                <button
                    type="button"
                    class="show-password"
                    data-target="registerPassword"
                >
                    表示
                </button>

            </div>

            <div class="password-rule">
                パスワードは8文字以上にしてください。
            </div>

        </div>


        <button
            type="submit"
            class="button"
        >
            新規登録
        </button>


        <div class="security-note">
            🔒 セキュリティ補強のため、
            登録後にメールアドレスを追加できます。
            <br>
            メールアドレスの登録は任意です。
        </div>

    </form>

</div>


<script>

    const loginTab =
        document.getElementById("loginTab");

    const registerTab =
        document.getElementById("registerTab");

    const loginForm =
        document.getElementById("loginForm");

    const registerForm =
        document.getElementById("registerForm");

    const message =
        document.getElementById("message");


    function showLogin() {

        loginTab.classList.add("active");
        registerTab.classList.remove("active");

        loginForm.classList.add("active");
        registerForm.classList.remove("active");

        message.classList.remove("show");
    }


    function showRegister() {

        loginTab.classList.remove("active");
        registerTab.classList.add("active");

        loginForm.classList.remove("active");
        registerForm.classList.add("active");

        message.classList.remove("show");
    }


    loginTab.addEventListener(
        "click",
        showLogin
    );


    registerTab.addEventListener(
        "click",
        showRegister
    );


    /*
     * パスワード表示・非表示
     */

    document
        .querySelectorAll(".show-password")
        .forEach(function(button) {

            button.addEventListener(
                "click",
                function() {

                    const targetId =
                        button.dataset.target;

                    const input =
                        document.getElementById(
                            targetId
                        );

                    if (
                        input.type ===
                        "password"
                    ) {

                        input.type =
                            "text";

                        button.textContent =
                            "非表示";

                    } else {

                        input.type =
                            "password";

                        button.textContent =
                            "表示";
                    }
                }
            );

        });


    /*
     * URLにエラーが付いている場合の表示
     */

    const params =
        new URLSearchParams(
            window.location.search
        );

    const error =
        params.get("error");

    if (error) {

        message.textContent =
            error;

        message.classList.add(
            "show"
        );
    }

</script>

</body>
</html>
```
