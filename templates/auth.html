<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mr.Red Banana Chat - ログイン</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans JP",
                sans-serif;

            background: #f5f6f8;
            color: #222;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;

            background: white;

            border-radius: 18px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.08);

            padding: 35px;
        }

        .logo {
            text-align: center;

            font-size: 28px;
            font-weight: 700;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #777;

            font-size: 14px;

            margin-bottom: 30px;
        }

        h1 {
            font-size: 22px;

            margin:
                0 0 20px;
        }

        .tabs {
            display: flex;

            border-bottom:
                1px solid #ddd;

            margin-bottom: 25px;
        }

        .tab {
            flex: 1;

            border: none;
            background: transparent;

            padding: 12px 5px;

            font-size: 15px;
            font-weight: 600;

            color: #888;

            cursor: pointer;

            border-bottom:
                2px solid transparent;
        }

        .tab.active {
            color: #111;

            border-bottom-color:
                #111;
        }

        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;

            font-size: 14px;
            font-weight: 600;

            margin-bottom: 7px;
        }

        .field input {
            width: 100%;

            padding: 12px 13px;

            border:
                1px solid #d8d8d8;

            border-radius: 9px;

            font-size: 15px;

            outline: none;

            transition:
                border-color 0.2s,
                box-shadow 0.2s;
        }

        .field input:focus {
            border-color: #111;

            box-shadow:
                0 0 0 3px
                rgba(0, 0, 0, 0.06);
        }

        .password-note {
            color: #888;

            font-size: 12px;

            margin-top: 5px;
        }

        .submit-button {
            width: 100%;

            border: none;

            border-radius: 10px;

            padding: 13px;

            font-size: 16px;
            font-weight: 600;

            background: #111;
            color: white;

            cursor: pointer;

            transition:
                opacity 0.2s,
                transform 0.1s;
        }

        .submit-button:hover {
            opacity: 0.85;
        }

        .submit-button:active {
            transform:
                scale(0.99);
        }

        .divider {
            display: flex;

            align-items: center;

            gap: 12px;

            margin: 25px 0;

            color: #999;

            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";

            flex: 1;

            height: 1px;

            background: #ddd;
        }

        .oauth-button {
            display: flex;

            justify-content: center;
            align-items: center;

            width: 100%;

            padding: 11px;

            margin-bottom: 10px;

            border:
                1px solid #ddd;

            border-radius: 9px;

            background: white;

            color: #222;

            text-decoration: none;

            font-size: 14px;
            font-weight: 600;

            transition:
                background 0.2s;
        }

        .oauth-button:hover {
            background: #f6f6f6;
        }

        .oauth-button:last-child {
            margin-bottom: 0;
        }

        .security-note {
            text-align: center;

            color: #888;

            font-size: 12px;

            line-height: 1.6;

            margin-top: 22px;
        }

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .container {
                padding: 28px 22px;
            }

            .logo {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        Mr.Red Banana Chat
    </div>

    <div class="subtitle">
        みんなで話せるチャットサービス
    </div>


    <!-- =====================================================
         タブ
         ===================================================== -->

    <div class="tabs">

        <button
            type="button"
            class="tab active"
            id="loginTab"
            onclick="showForm('login')"
        >
            ログイン
        </button>

        <button
            type="button"
            class="tab"
            id="registerTab"
            onclick="showForm('register')"
        >
            新規登録
        </button>

    </div>


    <!-- =====================================================
         ログイン
         ===================================================== -->

    <form
        method="POST"
        action="{{ url_for('login') }}"
        class="form active"
        id="loginForm"
    >

        <h1>
            ログイン
        </h1>

        <div class="field">

            <label for="loginUsername">
                ユーザーネーム
                またはメールアドレス
            </label>

            <input
                type="text"
                id="loginUsername"
                name="username"
                autocomplete="username"
                required
            >

        </div>


        <div class="field">

            <label for="loginPassword">
                パスワード
            </label>

            <input
                type="password"
                id="loginPassword"
                name="password"
                autocomplete="current-password"
                required
            >

        </div>


        <button
            type="submit"
            class="submit-button"
        >
            ログイン
        </button>

    </form>


    <!-- =====================================================
         新規登録
         ===================================================== -->

    <form
        method="POST"
        action="{{ url_for('register') }}"
        class="form"
        id="registerForm"
    >

        <h1>
            新規登録
        </h1>

        <div class="field">

            <label for="registerUsername">
                ユーザーネーム
            </label>

            <input
                type="text"
                id="registerUsername"
                name="username"
                autocomplete="username"
                maxlength="100"
                required
            >

        </div>


        <div class="field">

            <label for="registerPassword">
                パスワード
            </label>

            <input
                type="password"
                id="registerPassword"
                name="password"
                autocomplete="new-password"
                minlength="8"
                required
            >

            <div class="password-note">
                8文字以上で設定してください。
            </div>

        </div>


        <button
            type="submit"
            class="submit-button"
        >
            アカウントを作成
        </button>

    </form>


    <!-- =====================================================
         OAuth
         ===================================================== -->

    <div class="divider">
        または
    </div>


    <a
        href="{{ url_for('oauth_login', provider='google') }}"
        class="oauth-button"
    >
        Googleでログイン
    </a>


    <a
        href="{{ url_for('oauth_login', provider='github') }}"
        class="oauth-button"
    >
        GitHubでログイン
    </a>


    <a
        href="{{ url_for('oauth_login', provider='azure') }}"
        class="oauth-button"
    >
        Microsoftでログイン
    </a>


    <div class="security-note">
        メールアドレスは新規登録時には必須ではありません。<br>
        登録後にセキュリティ用メールアドレスを設定できます。
    </div>

</div>


<script>

    function showForm(type) {

        const loginForm =
            document.getElementById("loginForm");

        const registerForm =
            document.getElementById("registerForm");

        const loginTab =
            document.getElementById("loginTab");

        const registerTab =
            document.getElementById("registerTab");


        if (type === "login") {

            loginForm.classList.add("active");
            registerForm.classList.remove("active");

            loginTab.classList.add("active");
            registerTab.classList.remove("active");

        } else {

            loginForm.classList.remove("active");
            registerForm.classList.add("active");

            loginTab.classList.remove("active");
            registerTab.classList.add("active");

        }

    }

</script>

</body>
</html>
