<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>パスワード再設定 - Mr.Red Banana Chat</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans JP",
                sans-serif;
            background:
                linear-gradient(
                    135deg,
                    #f5f6f8,
                    #e9ebef
                );
            color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: white;
            border-radius: 20px;
            box-shadow:
                0 12px 40px
                rgba(0, 0, 0, 0.10);
            padding: 40px;
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.7;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
        }

        .field input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d5d5d5;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        .button {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 14px;
            background: #111;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .message {
            margin-bottom: 20px;
            padding: 13px 15px;
            border-radius: 10px;
            background: #f0f7f3;
            color: #246b45;
            font-size: 14px;
            line-height: 1.7;
        }

        .note {
            margin-top: 22px;
            font-size: 13px;
            color: #777;
            line-height: 1.7;
        }

        .back {
            display: block;
            margin-top: 24px;
            text-align: center;
            color: #555;
            font-size: 14px;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="logo">
        Mr.Red Banana Chat
    </div>

    <div class="subtitle">
        登録済みのメールアドレスを入力してください。<br>
        パスワード再設定の案内を送信します。
    </div>

    {% if message %}

    <div class="message">
        {{ message }}
    </div>

    {% endif %}

    <form
        method="POST"
        action="{{ url_for('forgot_password') }}"
    >

        <div class="field">

            <label for="email">
                メールアドレス
            </label>

            <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                placeholder="example@example.com"
                required
            >

        </div>

        <button
            type="submit"
            class="button"
        >
            再設定メールを送信
        </button>

    </form>

    <div class="note">
        メールアドレスを登録していないアカウントは、
        再設定メールを受け取れません。
    </div>

    <a
        class="back"
        href="{{ url_for('index') }}"
    >
        ログイン画面へ戻る
    </a>

</div>

</body>

</html>
