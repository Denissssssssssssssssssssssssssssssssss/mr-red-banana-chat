<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>セキュリティ設定 - Mr.Red Banana Chat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans JP",
                sans-serif;

            background: #f5f5f5;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 32px 28px;

            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.08);

            text-align: center;
        }

        h1 {
            margin: 0 0 18px;
            font-size: 24px;
        }

        .description {
            margin-bottom: 26px;

            line-height: 1.7;
            font-size: 14px;
            color: #555;
        }

        .email-form {
            margin-bottom: 22px;
        }

        input[type="email"] {
            width: 100%;
            padding: 13px 14px;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 15px;
            outline: none;
        }

        input[type="email"]:focus {
            border-color: #555;
        }

        .submit-button {
            width: 100%;
            margin-top: 10px;

            padding: 13px;

            border: none;
            border-radius: 8px;

            background: #222;
            color: white;

            font-size: 15px;
            cursor: pointer;
        }

        .submit-button:hover {
            opacity: 0.9;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;

            margin: 22px 0;

            color: #999;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #ddd;
        }

        .oauth-button {
            display: block;

            width: 100%;
            margin-bottom: 10px;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 8px;

            background: white;
            color: #222;

            font-size: 14px;
            text-decoration: none;

            cursor: pointer;
        }

        .oauth-button:hover {
            background: #f7f7f7;
        }

        .skip {
            display: inline-block;

            margin-top: 18px;

            font-size: 12px;
            color: #888;

            text-decoration: underline;
            cursor: pointer;
        }

        .skip:hover {
            color: #555;
        }

        .security-note {
            margin-top: 22px;

            font-size: 11px;
            line-height: 1.6;

            color: #999;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>
            セキュリティを強化しましょう
        </h1>

        <div class="description">
            セキュリティ補強のため、<br>
            メールアドレスを追加しましょう。
            <br><br>
            パスワードを忘れた場合などに、
            アカウントを復旧できるようになります。
        </div>


        <!-- ==============================
             メールアドレス追加
             ============================== -->

        <form
            class="email-form"
            action="/security_email"
            method="post"
        >

            <input
                type="email"
                name="email"
                placeholder="メールアドレス"
                autocomplete="email"
                required
            >

            <button
                type="submit"
                class="submit-button"
            >
                メールを追加する
            </button>

        </form>


        <div class="divider">
            または
        </div>


        <!-- ==============================
             OAuth
             ============================== -->

        <a
            href="/auth/google"
            class="oauth-button"
        >
            Googleで続ける
        </a>

        <a
            href="/auth/github"
            class="oauth-button"
        >
            GitHubで続ける
        </a>

        <a
            href="/auth/azure"
            class="oauth-button"
        >
            Microsoft Accountで続ける
        </a>


        <!-- ==============================
             スキップ
             ============================== -->

        <a
            href="/skip_security_email"
            class="skip"
        >
            スキップする
        </a>


        <div class="security-note">
            メールアドレスの追加は任意です。
            <br>
            後から設定することもできます。
        </div>

    </div>

</div>

</body>

</html>
