<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>セキュリティメール - Mr.Red Banana Chat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans JP",
                sans-serif;

            background: #f5f6f8;
            color: #222;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;

            background: white;

            border-radius: 18px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.08);

            padding: 38px;
        }

        .logo {
            text-align: center;

            font-size: 26px;
            font-weight: 700;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #777;

            font-size: 14px;

            margin-bottom: 30px;
        }

        h1 {
            font-size: 23px;

            margin:
                0 0 15px;
        }

        .description {
            color: #555;

            line-height: 1.8;

            font-size: 14px;

            margin-bottom: 25px;
        }

        .current-email {
            background: #f6f6f6;

            border:
                1px solid #e1e1e1;

            border-radius: 10px;

            padding: 14px;

            margin-bottom: 25px;
        }

        .current-email-title {
            font-size: 12px;

            color: #888;

            margin-bottom: 6px;
        }

        .current-email-value {
            font-size: 14px;

            word-break: break-all;

            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Consolas,
                monospace;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;

            font-size: 14px;
            font-weight: 600;

            margin-bottom: 7px;
        }

        .field input {
            width: 100%;

            padding: 13px;

            border:
                1px solid #d8d8d8;

            border-radius: 9px;

            font-size: 15px;

            outline: none;

            transition:
                border-color 0.2s,
                box-shadow 0.2s;
        }

        .field input:focus {
            border-color: #111;

            box-shadow:
                0 0 0 3px
                rgba(0, 0, 0, 0.06);
        }

        .save-button {
            width: 100%;

            border: none;

            border-radius: 10px;

            padding: 13px;

            background: #111;
            color: white;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            transition:
                opacity 0.2s,
                transform 0.1s;
        }

        .save-button:hover {
            opacity: 0.85;
        }

        .save-button:active {
            transform: scale(0.99);
        }

        .skip-area {
            margin-top: 18px;
        }

        .skip-button {
            width: 100%;

            border:
                1px solid #ddd;

            border-radius: 10px;

            padding: 12px;

            background: white;
            color: #555;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.2s;
        }

        .skip-button:hover {
            background: #f6f6f6;
        }

        .note {
            text-align: center;

            color: #888;

            font-size: 12px;

            line-height: 1.7;

            margin-top: 20px;
        }

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .container {
                padding: 28px 22px;
            }

            .logo {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        Mr.Red Banana Chat
    </div>

    <div class="subtitle">
        アカウントのセキュリティ設定
    </div>


    <h1>
        セキュリティ用メールアドレス
    </h1>


    <div class="description">
        {{ username }}さん、アカウントの安全性を高めるため、
        メールアドレスを登録できます。
        パスワードを忘れた場合などに役立ちます。
    </div>


    {% if email_is_placeholder %}

        <div class="current-email">

            <div class="current-email-title">
                現在登録されているメールアドレス
            </div>

            <div class="current-email-value">
                {{ email }}
            </div>

        </div>

    {% else %}

        <div class="current-email">

            <div class="current-email-title">
                現在登録されているメールアドレス
            </div>

            <div class="current-email-value">
                {{ email }}
            </div>

        </div>

    {% endif %}


    <form
        method="POST"
        action="{{ url_for('save_security_email') }}"
    >

        <div class="field">

            <label for="email">
                新しいメールアドレス
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="example@example.com"
                autocomplete="email"
                required
            >

        </div>


        <button
            type="submit"
            class="save-button"
        >
            メールアドレスを登録して続ける
        </button>

    </form>


    <div class="skip-area">

        <form
            method="POST"
            action="{{ url_for('skip_security_email') }}"
        >

            <button
                type="submit"
                class="skip-button"
            >
                今は登録しない
            </button>

        </form>

    </div>


    <div class="note">
        メールアドレスは後から変更できます。<br>
        登録しなくてもMr.Red Banana Chatを利用できます。
    </div>

</div>

</body>
</html>
