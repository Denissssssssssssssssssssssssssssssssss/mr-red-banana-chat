<!DOCTYPE html>

<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>セキュリティ補強</title>

<style>
    body {
        margin: 0;
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        background: #f5f5f5;
        font-family: Arial, sans-serif;
    }

    .container {
        width: 90%;
        max-width: 480px;

        background: white;

        padding: 35px;
        box-sizing: border-box;

        border-radius: 16px;

        box-shadow:
            0 4px 20px rgba(0, 0, 0, 0.08);

        text-align: center;
    }

    h1 {
        margin-top: 0;
        margin-bottom: 12px;

        font-size: 26px;
    }

    .description {
        color: #555;
        line-height: 1.7;
        margin-bottom: 25px;
    }

    .email-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    input[type="email"] {
        width: 100%;

        padding: 13px;

        box-sizing: border-box;

        border: 1px solid #ccc;
        border-radius: 8px;

        font-size: 16px;
    }

    button {
        width: 100%;

        padding: 13px;

        border: none;
        border-radius: 8px;

        background: #222;
        color: white;

        font-size: 16px;

        cursor: pointer;
    }

    button:hover {
        opacity: 0.85;
    }

    .divider {
        display: flex;
        align-items: center;
        gap: 12px;

        margin: 25px 0;
    }

    .divider::before,
    .divider::after {
        content: "";

        flex: 1;

        height: 1px;

        background: #ddd;
    }

    .divider span {
        color: #888;
        font-size: 13px;
    }

    .oauth-buttons {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .oauth-button {
        display: block;

        width: 100%;

        padding: 12px;

        box-sizing: border-box;

        border: 1px solid #ddd;
        border-radius: 8px;

        background: white;
        color: #222;

        text-decoration: none;

        font-size: 15px;
    }

    .oauth-button:hover {
        background: #f7f7f7;
    }

    .skip {
        display: block;

        margin-top: 25px;

        font-size: 12px;
        color: #999;

        text-decoration: underline;
    }

    .skip:hover {
        color: #555;
    }
</style>
```

</head>

<body>

<div class="container">

```
<h1>セキュリティ補強</h1>

<p class="description">
    セキュリティ補強のため、<br>
    メールアドレスを追加しましょう。
</p>

<!-- メールアドレス追加 -->
<form
    class="email-form"
    action="{{ url_for('security_email') }}"
    method="post"
>

    <input
        type="email"
        name="email"
        placeholder="メールアドレス"
        autocomplete="email"
    >

    <button type="submit">
        メールを追加
    </button>

</form>

<div class="divider">
    <span>または</span>
</div>

<!-- 外部アカウント -->
<div class="oauth-buttons">

    <a
        class="oauth-button"
        href="{{ url_for('oauth_login', provider='google') }}"
    >
        Googleで続ける
    </a>

    <a
        class="oauth-button"
        href="{{ url_for('oauth_login', provider='github') }}"
    >
        GitHubで続ける
    </a>

    <a
        class="oauth-button"
        href="{{ url_for('oauth_login', provider='azure') }}"
    >
        Microsoft Accountで続ける
    </a>

</div>

<!-- メールを登録しない -->
<a
    class="skip"
    href="{{ url_for('skip_security_email') }}"
>
    今はスキップする
</a>

</div>

</body>
</html>
