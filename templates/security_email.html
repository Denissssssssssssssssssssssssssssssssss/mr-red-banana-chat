<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>セキュリティ補強</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f5f5f5;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: #222;
        }

        .container {
            width: 100%;
            max-width: 430px;

            padding: 32px;

            background: white;

            border-radius: 16px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.08);

            text-align: center;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 12px;

            font-size: 26px;
        }

        .description {
            margin-bottom: 26px;

            line-height: 1.7;

            color: #555;

            font-size: 14px;
        }

        .email-form {
            margin-bottom: 22px;
        }

        input[type="email"] {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        input[type="email"]:focus {
            border-color: #666;
        }

        .email-button {
            width: 100%;

            margin-top: 10px;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #222;

            color: white;

            font-size: 15px;

            cursor: pointer;
        }

        .email-button:hover {
            opacity: 0.85;
        }

        .divider {
            display: flex;

            align-items: center;

            gap: 10px;

            margin: 24px 0;

            color: #999;

            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";

            flex: 1;

            height: 1px;

            background: #ddd;
        }

        .oauth-button {
            width: 100%;

            margin-bottom: 10px;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 8px;

            background: white;

            color: #222;

            font-size: 14px;

            cursor: pointer;
        }

        .oauth-button:hover {
            background: #f7f7f7;
        }

        .skip {
            display: block;

            margin-top: 22px;

            color: #999;

            font-size: 12px;

            text-decoration: underline;

            cursor: pointer;
        }

        .skip:hover {
            color: #555;
        }

        .message {
            display: none;

            margin-top: 15px;

            padding: 10px;

            border-radius: 7px;

            background: #fff3cd;

            color: #856404;

            font-size: 13px;

            line-height: 1.5;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>
        セキュリティ補強
    </h1>


    <div class="description">

        セキュリティ補強のため、<br>
        メールアドレスを追加しましょう。<br><br>

        パスワードを忘れた場合などに、
        アカウントを安全に復旧できます。

    </div>


    <!-- =================================================
         メールアドレス追加
         ================================================= -->

    <form
        class="email-form"
        action="/security_email"
        method="post"
    >

        <input
            type="email"
            name="email"
            placeholder="メールアドレス"
            autocomplete="email"
        >

        <button
            type="submit"
            class="email-button"
        >
            メールアドレスを追加
        </button>

    </form>


    <!-- =================================================
         OAuth
         ================================================= -->

    <div class="divider">
        または
    </div>


    <button
        type="button"
        class="oauth-button"
        onclick="loginWithProvider('google')"
    >
        Googleで続行
    </button>


    <button
        type="button"
        class="oauth-button"
        onclick="loginWithProvider('github')"
    >
        GitHubで続行
    </button>


    <button
        type="button"
        class="oauth-button"
        onclick="loginWithProvider('azure')"
    >
        Microsoft Accountで続行
    </button>


    <!-- =================================================
         メッセージ
         ================================================= -->

    <div
        id="message"
        class="message"
    ></div>


    <!-- =================================================
         スキップ
         ================================================= -->

    <a
        class="skip"
        href="/skip_security_email"
    >
        今はスキップする
    </a>

</div>


<script>

    function loginWithProvider(provider) {

        window.location.href =
            "/auth/" + provider;

    }


    /*
     * URLにエラーが返ってきた場合
     */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const error =
        params.get("error");


    const message =
        document.getElementById(
            "message"
        );


    if (error) {

        message.style.display = "block";

        message.textContent =
            "認証に失敗しました。もう一度お試しください。";

    }

</script>

</body>

</html>
