<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Mr.Red Banana 暇人チャッツ</title>

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>

body{
    font-family:Arial;
    margin:20px;
    background:#111;
    color:white;
}

/* ===== ロゴ ===== */

#logo{
    position:fixed;
    top:10px;
    left:10px;
    width:200px;
    z-index:1000;
}

/* ===== メイン ===== */

#main{
    margin-top:80px;
}

/* ===== メッセージ ===== */

#messages{
    height:300px;
    overflow-y:scroll;
    border:1px solid gray;
    padding:10px;
    background:#222;
    border-radius:10px;
}

#messages li{
    background:#222;
    padding:8px;
    margin:6px 0;
    border-radius:8px;
    list-style:none;
}

#messages li.me{
    color:#38b48b;
    font-weight:bold;
}

/* ===== 通知 ===== */

.notice{
    color:#ffd700;
    font-weight:bold;
}

/* ===== ボタン ===== */

button{
    margin:5px;
    padding:8px 12px;
    border:none;
    border-radius:6px;
    background:#777;
    color:white;
    cursor:pointer;
}

button.delete{
    background:#ff0000;
}

button.call{
    background:#38b48b;
}

button.join-call{
    background:#5865f2;
}

/* ===== 入力 ===== */

input{
    padding:8px;
    border-radius:6px;
    border:none;
}

/* ===== 履歴 ===== */

.history-item{
    margin:8px 0;
}

/* メモ欄 */

.history-item input{
    margin-left:10px;
    width:150px;
    background:#222;
    color:white;
}

/* ✔マーク */

.check{
    color:#38b48b;
    margin-left:5px;
    font-weight:bold;
    opacity:0;
    transition:0.3s;
}

.check.show{
    opacity:1;
}

/* ===== セキュリティ ===== */

#securityPanel{
    display:none;
    background:#222;
    padding:10px;
    border-radius:10px;
    margin-top:10px;
}

</style>

</head>

<body>

<!-- ロゴ -->

<img id="logo" src="/static/logo.png">

<div id="main">

<h2>
こんにちは {{ username }} さん
</h2>

<a href="/logout" style="color:white;">
ログアウト
</a>

<hr>

<!-- ======================
     ホーム
====================== -->

<div id="homeArea">

<button onclick="createRoom()">
ルーム作成
</button>

<br><br>

<input
    id="roomInput"
    placeholder="8桁IDを入力"
    maxlength="8"
    inputmode="numeric"
>

<button onclick="joinRoom()">
参加
</button>

<h3>
あなたのルーム履歴
</h3>

<ul>

{% for r in room_history %}

<li class="history-item">

    ルームID : {{ r[0] }}

    <input
        value="{{ r[1] or '' }}"
        placeholder="メモ"
        oninput="saveNote('{{ r[0] }}', this)"
    >

    <span
        class="check"
        id="check-{{ r[0] }}"
    >
    ✔
    </span>

    <button onclick="joinHistory('{{ r[0] }}')">
    参加
    </button>

    <button
        class="delete"
        onclick="deleteRoom('{{ r[0] }}')"
    >
    削除
    </button>

</li>

{% endfor %}

</ul>

</div>

<!-- ======================
     チャット
====================== -->

<div
    id="chatArea"
    style="display:none;"
>

<div
    style="
    display:flex;
    align-items:center;
    gap:10px;
    "
>

<h3 id="roomTitle"></h3>

<button onclick="toggleSecurityPanel()">
🔒
</button>

</div>

<button onclick="leaveRoom()">
退出
</button>

<button
    class="call"
    onclick="openCall()"
>
📞 通話する
</button>

<!-- ======================
     セキュリティ
====================== -->

<div id="securityPanel">

<p>
部屋のパスワード保護
</p>

<label>

<input
    type="checkbox"
    id="passwordEnabled"
>

ON / OFF

</label>

<br><br>

<input
    type="password"
    id="roomPassword"
    placeholder="部屋パスワード"
>

<button onclick="saveRoomPassword()">
保存
</button>

<p
    style="
    font-size:12px;
    color:gray;
    "
>

注意：
設定すると、
初参加メンバーは
パスワードが必要になります

</p>

</div>

<br><br>

<ul id="messages"></ul>

<br>

<input
    id="msg"
    autocomplete="off"
    placeholder="メッセージ"
>

<button onclick="sendMessage()">
送信
</button>

<button onclick="toggleNotify()">
通知モード
</button>

</div>

</div>

<script>

var socket = io();

var currentRoom = null;

var notifyMode = false;

/* ======================
   スクロール
====================== */

function scrollToBottom(){

    var messages =
        document.getElementById(
            "messages"
        );

    messages.scrollTop =
        messages.scrollHeight;

}

/* ======================
   ルーム作成
====================== */

function createRoom(){

    socket.emit("create_room");

}

/* ======================
   ルーム参加
====================== */

async function joinRoom(){

    var roomId =
        document
        .getElementById("roomInput")
        .value;

    var regex=/^[0-9]{8}$/;

    if(!regex.test(roomId)){

        alert(
            "ルームIDは半角数字8桁のみです"
        );

        return;
    }

    // PASS確認

    let response =
        await fetch(
            "/check_room_password",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    room:roomId
                })
            }
        );

    let result =
        await response.json();

    // OKなら即参加

    if(result.ok){

        socket.emit(
            "join_room_by_id",
            {
                room:roomId
            }
        );

        return;
    }

    // PASS要求

    let pass =
        prompt(
            "この部屋にはパスワードがあります"
        );

    if(pass===null){
        return;
    }

    // PASS再確認

    response =
        await fetch(
            "/check_room_password",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    room:roomId,
                    password:pass
                })
            }
        );

    result =
        await response.json();

    if(!result.ok){

        alert(
            "パスワードが違います"
        );

        return;
    }

    socket.emit(
        "join_room_by_id",
        {
            room:roomId
        }
    );

}

/* ======================
   履歴参加
====================== */

function joinHistory(roomId){

    socket.emit(
        "join_room_by_id",
        {
            room:roomId
        }
    );

}

/* ======================
   通話
====================== */

function openCall(){

    if(!currentRoom){
        return;
    }

    // 通話通知

    socket.emit(
        "call_started",
        {
            room:currentRoom
        }
    );

    // 通話ページ

    window.open(
        "/call/" + currentRoom,
        "_blank"
    );

}

/* ======================
   通話参加
====================== */

function joinCall(roomId){

    window.open(
        "/call/" + roomId,
        "_blank"
    );

}

/* ======================
   メモ保存
====================== */

function saveNote(roomId, input){

    fetch(
        "/save_note",
        {

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                room:roomId,
                note:input.value
            })

        }

    ).then(()=>{

        var check =
            document.getElementById(
                "check-"+roomId
            );

        check.classList.add("show");

        setTimeout(()=>{

            check.classList.remove("show");

        },1500);

    });

}

/* ======================
   履歴削除
====================== */

function deleteRoom(roomId){

    var confirmDelete =
        confirm(
            "本当に削除しますか？"
        );

    if(!confirmDelete){
        return;
    }

    fetch(
        "/delete_room",
        {

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                room:roomId
            })

        }

    ).then(()=>{

        location.reload();

    });

}

/* ======================
   退出
====================== */

function leaveRoom(){

    socket.emit(
        "leave_room",
        {
            room:currentRoom
        }
    );

    currentRoom = null;

    document
    .getElementById("chatArea")
    .style.display = "none";

    document
    .getElementById("homeArea")
    .style.display = "block";

}

/* ======================
   送信
====================== */

function sendMessage(){

    var msg =
        document.getElementById(
            "msg"
        ).value;

    if(msg && currentRoom){

        socket.emit(
            "message",
            {
                room:currentRoom,
                message:msg
            }
        );

        document
        .getElementById("msg")
        .value = "";

    }

}

/* ======================
   通知
====================== */

function toggleNotify(){

    notifyMode = !notifyMode;

    if(notifyMode){

        if(
            Notification.permission==="default"
        ){
            Notification.requestPermission();
        }

        alert("通知モード ON");

    }else{

        alert("通知モード OFF");

    }

}

/* ======================
   セキュリティ
====================== */

function toggleSecurityPanel(){

    const panel =
        document.getElementById(
            "securityPanel"
        );

    if(panel.style.display==="none"){

        panel.style.display="block";

    }else{

        panel.style.display="none";

    }

}

/* ======================
   PASS保存
====================== */

function saveRoomPassword(){

    const enabled =
        document.getElementById(
            "passwordEnabled"
        ).checked;

    const password =
        document.getElementById(
            "roomPassword"
        ).value;

    fetch(
        "/set_room_password",
        {
            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                room:currentRoom,

                enabled:enabled,

                password:password

            })

        }

    ).then(()=>{

        alert(
            "ルームパスワード保存完了"
        );

    });

}

/* ======================
   socket
====================== */

socket.on("room_created",function(data){

    currentRoom = data.room;

    enterRoom(
        "作成したルーム ID : " +
        data.room
    );

});

socket.on("joined",function(data){

    currentRoom = data.room;

    enterRoom(
        "参加中ルーム ID : " +
        data.room
    );

});

/* ======================
   チャット
====================== */

socket.on("chat_message",function(data){

    var li =
        document.createElement("li");

    li.textContent =
        data.username +
        " : " +
        data.message;

    if(
        data.username ===
        "{{ username }}"
    ){
        li.classList.add("me");
    }

    var messages =
        document.getElementById(
            "messages"
        );

    messages.appendChild(li);

    scrollToBottom();

    // 通知

    if(
        notifyMode &&
        Notification.permission==="granted"
    ){

        new Notification(
            "M.R.B",
            {
                body:
                    data.username +
                    " : " +
                    data.message
            }
        );

    }

});

/* ======================
   通話開始通知
====================== */

socket.on("call_notification",function(data){

    var li =
        document.createElement("li");

    li.classList.add("notice");

    li.innerHTML =

        "⭐通知：" +

        data.username +

        "さんが通話を始めました " +

        "<button class='join-call' " +

        "onclick=\"joinCall('" +

        data.room +

        "')\">" +

        "参加する" +

        "</button>";

    document
        .getElementById("messages")
        .appendChild(li);

    scrollToBottom();

    // 通知モード

    if(
        notifyMode &&
        Notification.permission==="granted"
    ){

        var n = new Notification(

            data.username +
            "さんが通話を始めました",

            {
                body:"クリックして参加"
            }

        );

        n.onclick = function(){

            window.open(
                "/call/" + data.room,
                "_blank"
            );

        };

    }

});

/* ======================
   通話終了通知
====================== */

socket.on("call_end_notification",function(data){

    var li =
        document.createElement("li");

    li.classList.add("notice");

    li.innerHTML =

        "⭐通知：" +

        data.username +

        "さんが通話を終了しました";

    document
        .getElementById("messages")
        .appendChild(li);

    scrollToBottom();

});

/* ======================
   入室
====================== */

function enterRoom(title){

    document
    .getElementById("homeArea")
    .style.display = "none";

    document
    .getElementById("chatArea")
    .style.display = "block";

    document
    .getElementById("roomTitle")
    .innerText = title;

    document
    .getElementById("messages")
    .innerHTML = "";

}

/* ======================
   数字制限
====================== */

document
.getElementById("roomInput")
.addEventListener("input",function(){

    this.value =
        this.value.replace(
            /[^0-9]/g,
            ""
        );

});

/* ======================
   Enter送信
====================== */

document
.getElementById("msg")
.addEventListener("keypress",function(e){

    if(e.key==="Enter"){
        sendMessage();
    }

});

</script>

</body>
</html>
