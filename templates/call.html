<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>通話ルーム</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Socket.IO -->
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<!-- SkyWay -->
<script src="https://cdn.jsdelivr.net/npm/skyway-js@4.4.4/dist/skyway.min.js"></script>

<style>

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
}

/* ===== 上バー ===== */

#topbar{
    background:#222;
    padding:15px;
}

/* ===== 動画 ===== */

video{
    width:300px;
    margin:10px;
    border-radius:10px;
    background:black;
    object-fit:cover;
}

/* 自分の映像だけ反転 */

#my-video{
    transform:scaleX(-1);
}

/* 相手映像エリア */

#remote-videos{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    padding-bottom:30px;
}

/* ===== ボタン ===== */

button{
    padding:10px 15px;
    border:none;
    border-radius:8px;
    color:white;
    cursor:pointer;
    margin-top:10px;
    margin-left:5px;
    margin-right:5px;
    font-size:15px;
}

/* 通話終了 */

.end-btn{
    background:#ff4444;
}

/* ミュート */

.mute-btn{
    background:#5865f2;
}

/* カメラ */

.camera-btn{
    background:#38b48b;
}

</style>

</head>

<body>

<div id="topbar">

<h2>
📞 通話ルーム :
{{ room_id }}
</h2>

<button
    class="end-btn"
    onclick="leaveCall()"
>
❌ 通話終了
</button>

<button
    class="mute-btn"
    onclick="toggleMute()"
>
🔇 ミュート
</button>

<button
    class="camera-btn"
    onclick="toggleCamera()"
>
📷 カメラOFF
</button>

</div>

<!-- 自分 -->

<video
    id="my-video"
    autoplay
    muted
    playsinline>
</video>

<!-- 相手 -->

<div id="remote-videos"></div>

<script>

const socket = io();

let localStream;

let peer;

let room;

let audioEnabled = true;

let videoEnabled = true;

const ROOM_ID = "{{ room_id }}";

/* ======================
   通話開始
====================== */

async function startCall(){

    try{

        // カメラ・マイク取得

        localStream =
            await navigator.mediaDevices.getUserMedia({

                video:true,
                audio:true

            });

        // 自分映像表示

        const myVideo =
            document.getElementById("my-video");

        myVideo.srcObject = localStream;

        // Peer作成

        peer = new Peer({

            // SkyWay APIキー
            key:"ここにSkyWayAPIキー"

        });

        peer.on("open", ()=>{

            // ルーム参加

            room = peer.joinRoom(

                ROOM_ID,

                {
                    mode:"mesh",
                    stream:localStream
                }

            );

            // 相手映像受信

            room.on("stream", stream=>{

                const video =
                    document.createElement("video");

                video.srcObject = stream;

                video.autoplay = true;

                video.playsInline = true;

                // 相手ID保存

                video.setAttribute(
                    "data-peer-id",
                    stream.peerId
                );

                document
                    .getElementById("remote-videos")
                    .appendChild(video);

            });

            // 相手退出

            room.on("peerLeave", peerId=>{

                const videos =
                    document.querySelectorAll(
                        "#remote-videos video"
                    );

                videos.forEach(video=>{

                    if(
                        video.dataset.peerId === peerId
                    ){
                        video.remove();
                    }

                });

            });

        });

    }catch(err){

        console.error(err);

        alert(
            "カメラまたはマイクを使用できません"
        );

    }

}

/* ======================
   通話終了
====================== */

function leaveCall(){

    // 通話終了通知

    socket.emit("call_ended",{
        room:ROOM_ID
    });

    // SkyWay終了

    if(room){
        room.close();
    }

    // カメラ・マイク停止

    if(localStream){

        localStream
        .getTracks()
        .forEach(track=>{

            track.stop();

        });

    }

    // タブ閉じる

    window.close();

}

/* ======================
   ミュート
====================== */

function toggleMute(){

    if(!localStream){
        return;
    }

    audioEnabled = !audioEnabled;

    localStream
    .getAudioTracks()
    .forEach(track=>{

        track.enabled = audioEnabled;

    });

    // ボタン変更

    const btn =
        document.querySelector(".mute-btn");

    if(audioEnabled){

        btn.innerText = "🔇 ミュート";

    }else{

        btn.innerText = "🔊 ミュート解除";

    }

}

/* ======================
   カメラ
====================== */

function toggleCamera(){

    if(!localStream){
        return;
    }

    videoEnabled = !videoEnabled;

    localStream
    .getVideoTracks()
    .forEach(track=>{

        track.enabled = videoEnabled;

    });

    // ボタン変更

    const btn =
        document.querySelector(".camera-btn");

    if(videoEnabled){

        btn.innerText = "📷 カメラOFF";

    }else{

        btn.innerText = "📷 カメラON";

    }

}

/* ======================
   自動開始
====================== */

startCall();

</script>

</body>
</html>
